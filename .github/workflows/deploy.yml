name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: registry.digitalocean.com/sicae
  DROPLET: 137.184.76.107

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: digital_ocean_secrets
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t $REGISTRY:latest .

      - name: Save & compress image
        run: docker save $REGISTRY:latest | gzip > sicae-image.tar.gz

      - name: Copy image to droplet
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ env.DROPLET }}
          port: 2222
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: sicae-image.tar.gz
          target: /tmp/

      - name: Load image & restart app
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DROPLET }}
          port: 2222
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: REGISTRY,RAILS_MASTER_KEY,DB_PASSWORD
          script: |
            set -e
            docker load < /tmp/sicae-image.tar.gz
            docker rm -f sicae-app 2>/dev/null || true
            docker run -d \
              --name sicae-app \
              --restart always \
              --network sicae-net \
              -e RAILS_ENV=production \
              -e RAILS_MASTER_KEY="$RAILS_MASTER_KEY" \
              -e DB_HOST=sicae-db \
              -e DB_USERNAME=sicae \
              -e DB_PASSWORD="$DB_PASSWORD" \
              -e DB_NAME=sicae_production \
              -e SICAE_DATABASE_HOST=sicae-db \
              -e SICAE_DATABASE_USERNAME=sicae \
              -e SICAE_DATABASE_PASSWORD="$DB_PASSWORD" \
              -e SICAE_DATABASE_NAME=sicae_production \
              $REGISTRY:latest
            rm -f /tmp/sicae-image.tar.gz
            docker image prune -f
        env:
          REGISTRY: ${{ env.REGISTRY }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
