services:
  db:
    image: postgres:15-alpine
    container_name: postgres-dev
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${SICAE_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${SICAE_DATABASE_PASSWORD}
      POSTGRES_DB: ${SICAE_DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  dev:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /rails
    env_file:
      - .env
    environment:
      RAILS_ENV: development
      PORT: 3000
      SICAE_DATABASE_HOST: db
      DB_HOST: db
      LISTEN_FORCE_POLLING: '1'
    depends_on:
      - db
    ports:
      - "3000:3000"
    # Use a regular bind mount (no :cached) so file changes are immediately visible
    volumes:
      - ./:/rails
    tty: true
    entrypoint: ["/bin/bash", "/rails/docker/dev-entrypoint.sh"]
    command: ["bin/dev"]

volumes:
  db_data:
