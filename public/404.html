```html
<!DOCTYPE html>
<html lang="en">
<head>
    <title>The page you were looking for doesn't exist (404 Not Found)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #111827;
            color: #ffffff;
        }

        .container {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 6rem 1.5rem;
        }

        .content {
            text-align: center;
            max-width: 700px;
        }

        .error-code {
            color: #818cf8;
            font-size: 1rem;
            font-weight: 600;
        }

        .title {
            margin-top: 1rem;
            font-size: 4.5rem;
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .description {
            margin-top: 1.5rem;
            font-size: 1.25rem;
            line-height: 1.8;
            color: #9ca3af;
        }

        .actions {
            margin-top: 2.5rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .button {
            display: inline-block;
            padding: 0.75rem 1rem;
            border-radius: 0.375rem;
            background-color: #6366f1;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .button:hover {
            background-color: #818cf8;
        }

        @media (max-width: 640px) {
            .title {
                font-size: 3rem;
            }

            .description {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <main class="container">
        <div class="content">
            <p class="error-code">404</p>

            <h1 class="title">
                Page not found
            </h1>

            <p class="description">
                Sorry, we couldn’t find the page you’re looking for.
            </p>

            <div class="actions">
                <a href="/" class="button">
                    Go back home
                </a>
            </div>
        </div>
    </main>

</body>
</html>
```
